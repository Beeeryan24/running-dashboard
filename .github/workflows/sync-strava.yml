name: Sync Strava

on:
  schedule:
    - cron: '15 */3 * * *'   # every 3 hours
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to check (use 3650 to load all history)'
        default: '30'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull new activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DAYS: ${{ github.event.inputs.days }}
        run: python3 sync_strava.py
      - name: Save changes
        run: |
          git config user.name "strava-sync"
          git config user.email "strava-sync@users.noreply.github.com"
          git add runs.json walks.json
          git diff --cached --quiet || (git commit -m "Update runs and walks from Strava" && git push)
